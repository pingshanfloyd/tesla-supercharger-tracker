<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特斯拉超充站第三方开放追踪</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(232, 65, 24, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 8px; position: relative; text-align: center; line-height: 1.4; }
        .header .subtitle { color: #8a8ab0; font-size: 14px; position: relative; text-align: center; }
        .sub-wrapper { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; position: relative; }
        .info-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; background: #2a2a4a; border: 1px solid #4a4a6a;
            border-radius: 50%; font-size: 10px; color: #8a8ab0; line-height: 1;
        }
        .sub-tooltip {
            display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            background: #1a1a28; border: 1px solid #2a2a4a; border-radius: 10px;
            padding: 14px 18px; font-size: 13px; color: #c0c0d0; line-height: 1.8;
            width: 420px; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .sub-wrapper:hover .sub-tooltip { display: block; }
        .sub-tooltip::before {
            content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
            border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 6px solid #2a2a4a;
        }
        .sub-tooltip-title { color: #8a8ab0; font-size: 12px; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .sub-tooltip li { margin: 3px 0; list-style: none; }
        .sub-tooltip li::before { content: '· '; color: #4a4a6a; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: #141420; border: 1px solid #1e1e30; border-radius: 12px; padding: 20px; text-align: center;
        }
        .stat-card .label { color: #6a6a8a; font-size: 13px; margin-bottom: 6px; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: #fff; }
        .stat-card .value.orange { color: #e84118; }
        .stat-card .value.green { color: #00d2d3; }
        .stat-card .value.blue { color: #54a0ff; }
        .stat-card .unit { font-size: 14px; color: #6a6a8a; margin-left: 2px; }
        .stat-card .value .slash { color: #4a4a6a; margin: 0 2px; }
        .changes-section { background: #141420; border: 1px solid #1e1e30; border-radius: 12px; margin-bottom: 24px; overflow: hidden; }
        .changes-section summary {
            padding: 16px 24px; list-style: none; display: flex; align-items: center; gap: 10px;
            cursor: pointer; user-select: none; border-bottom: 1px solid transparent; transition: border-color 0.2s;
        }
        .changes-section summary::-webkit-details-marker { display: none; }
        .changes-section details[open] summary { border-bottom-color: #1e1e30; }
        .changes-section summary .icon { font-size: 22px; }
        .changes-section summary h2 { font-size: 18px; font-weight: 600; color: #fff; flex: 1; }
        .changes-section summary .toggle-hint { font-size: 12px; color: #4a4a6a; transition: transform 0.2s; }
        .changes-section details[open] summary .toggle-hint { transform: rotate(180deg); }
        .changes-body { padding: 20px 24px; }
        .change-group { margin-bottom: 16px; }
        .change-group:last-child { margin-bottom: 0; }
        .change-group-title { font-size: 14px; font-weight: 600; color: #8a8ab0; margin-bottom: 8px; }
        .change-item { font-size: 14px; color: #c0c0d0; padding: 4px 0; }
        .change-item .flag { margin-right: 6px; }
        .region-section { background: #141420; border: 1px solid #1e1e30; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        .region-header {
            padding: 16px 24px; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid #1e1e30; flex-wrap: wrap;
        }
        .region-header .icon { font-size: 22px; }
        .region-header h2 { font-size: 18px; font-weight: 600; color: #fff; }
        .region-header .count {
            margin-left: auto; background: #1e1e30; color: #8a8ab0; padding: 2px 10px; border-radius: 20px; font-size: 13px;
        }
        .region-countries { padding: 10px 24px; color: #6a6a8a; font-size: 13px; border-bottom: 1px solid #12121e; line-height: 1.8; }
        .region-countries span { color: #8a8ab0; margin-right: 4px; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th {
            text-align: left; padding: 12px 20px; color: #6a6a8a; font-size: 12px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #1e1e30;
        }
        .data-table th:first-child { min-width: 5.5em; }
        .data-table td { padding: 10px 20px; font-size: 14px; border-bottom: 1px solid #12121e; }
        .data-table tbody tr { transition: background 0.15s; }
        .data-table tbody tr:hover { background: #1a1a28; }
        .data-table tbody tr.no-detail { cursor: default; }
        .data-table tbody tr.no-detail:hover { background: transparent; }
        .data-table .country { font-weight: 500; color: #fff; white-space: nowrap; }
        .data-table .num { font-variant-numeric: tabular-nums; color: #c0c0d0; text-align: right; }
        .data-table .pct-cell { width: 180px; }
        .pct-bar-wrap { display: flex; align-items: center; gap: 10px; }
        .pct-bar-bg { flex: 1; height: 8px; background: #1e1e30; border-radius: 4px; overflow: hidden; }
        .pct-bar { height: 100%; border-radius: 4px; }
        .pct-bar.high { background: linear-gradient(90deg, #00d2d3, #01a3a4); }
        .pct-bar.mid { background: linear-gradient(90deg, #54a0ff, #2e86de); }
        .pct-bar.low { background: linear-gradient(90deg, #feca57, #ff9f43); }
        .pct-bar.very-low { background: linear-gradient(90deg, #ff6b6b, #ee5a24); }
        .pct-val { min-width: 48px; text-align: right; font-size: 13px; font-weight: 600; }
        .pct-val.high { color: #00d2d3; }
        .pct-val.mid { color: #54a0ff; }
        .pct-val.low { color: #feca57; }
        .pct-val.very-low { color: #ff6b6b; }
        .full-row td { background: #0d1a0d; }
        .full-row .country { color: #00d2d3; }
        .footer { text-align: center; padding: 30px 20px; color: #4a4a6a; font-size: 13px; line-height: 1.8; }
        .footer a { color: #54a0ff; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 22px; }
            .stat-card .value { font-size: 22px; }
            .data-table th, .data-table td { padding: 10px 10px; font-size: 13px; }
            .pct-cell { width: 140px; }
        }
    </style>
</head>
<body>

                { name: '爱尔兰', open: 22, total: 25, openStalls: 156, totalStalls: 178 },
                { name: '克罗地亚', open: 23, total: 28, openStalls: 162, totalStalls: 196 },

            ]
        },

                { name: '韩国', open: 132, total: 186, openStalls: 912, totalStalls: 1239 },

                items: [
                    '中国 +5站（开放1074→1079）',
                '冰岛 +1站（开放19→20）',

                flag: '📉',
                items: [
                    '丹麦 -1站（开放49→48）',
                '克罗地亚 -1站（开放24→23）',
                '奥地利 -1站（开放65→64）',
                '波兰 -3站（开放28→25）'
                ]
            },
        {
                type: '🎯 全部开放（100%）',
                flag: '🎯',
                items: [
                    '立陶宛 开放率100%（3/3）'
                ]
            }
    ]
};

const D = REPORT_DATA;
const app = document.getElementById('app');

function fmt(n) { return n.toLocaleString(); }
function barCls(pct) {
    if (pct >= 80) return 'high';
    if (pct >= 60) return 'mid';
    if (pct >= 40) return 'low';
    return 'very-low';
}

function renderMain() {
    let html = `
    <div class="header">
        <h1>⚡ 特斯拉超充站<br>第三方开放${D.reportType}</h1>
        <div class="subtitle">
            <span class="sub-wrapper" tabindex="0">
                ${D.reportDate} · 数据来源 ${D.dataSource}
                <span class="info-icon">i</span>
                <div class="sub-tooltip">
                    <div class="sub-tooltip-title">统计口径说明</div>
                    <ul>
                        <li>总站点 = 所有站点的数量（含开放/扩建/建设中/审批中/规划中）</li>
                        <li>开放站点 = otherEVs=True 的站点（对第三方品牌开放）</li>
                        <li>开放率 = 开放站点 / 总站点</li>
                        <li>数据不含香港、澳门</li>
                    </ul>
                </div>
            </span>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="label">总站点 / 充电枪数</div>
            <div class="value">${fmt(D.totalSites)}<span class="slash">/</span>${fmt(D.totalStalls)}</div>
        </div>
        <div class="stat-card">
            <div class="label">开放站点 / 充电枪数</div>
            <div class="value orange">${fmt(D.openSites)}<span class="slash">/</span>${fmt(D.openStalls)}</div>
        </div>
        <div class="stat-card">
            <div class="label">全球开放率</div>
            <div class="value green">${D.openRate}<span class="unit">%</span></div>
        </div>
        <div class="stat-card">
            <div class="label">覆盖国家/地区</div>
            <div class="value blue">${D.totalCountries}</div>
        </div>
    </div>`;

    if (D.changes && D.changes.length > 0) {
        html += `<div class="changes-section"><details><summary>
            <span class="icon">📊</span><h2>本月变化</h2>
            <span class="toggle-hint">▾</span>
        </summary><div class="changes-body">`;
        D.changes.forEach(c => {
            html += `<div class="change-group"><div class="change-group-title">${c.type}</div>`;
            c.items.forEach(item => { html += `<div class="change-item"><span class="flag">${c.flag}</span>${item}</div>`; });
            html += `</div>`;
        });
        html += `</div></details></div>`;
    }

    D.regions.forEach(region => {
        const countryList = region.countries.map(c => c.name).join('、');
        html += `
    <div class="region-section">
        <div class="region-header">
            <span class="icon">${region.icon}</span>
            <h2>${region.name}</h2>
            <span class="count">${region.countries.length} 个国家/地区</span>
        </div>
        <div class="region-countries"><span>包含：</span>${countryList}</div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>国家/地区</th>
                    <th style="text-align:right">开放站点</th>
                    <th style="text-align:right">总站点</th>
                    <th style="text-align:right">开放充电枪</th>
                    <th style="text-align:right">总充电枪</th>
                    <th class="pct-cell">开放率</th>
                </tr>
            </thead>
            <tbody>`;
        region.countries.forEach(c => {
            const pct = c.rate;
            const cls = barCls(pct);
            const isFull = pct === 100;
            const rowAttrs = isFull ? ` class="full-row"` : ` class="no-detail"`;
            html += `<tr${rowAttrs}>
                <td class="country">${c.name}</td>
                <td class="num">${fmt(c.open)}</td>
                <td class="num">${fmt(c.total)}</td>
                <td class="num">${fmt(c.openStalls)}</td>
                <td class="num">${fmt(c.totalStalls)}</td>
                <td class="pct-cell"><div class="pct-bar-wrap"><div class="pct-bar-bg"><div class="pct-bar ${cls}" style="width:${pct.toFixed(1)}%"></div></div><span class="pct-val ${cls}">${pct.toFixed(1)}%</span></div></td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
    });

    html += `
    <div class="footer">
        共 ${D.totalCountries} 个国家/地区有超充站开放给第三方（otherEVs=true）。<br>
        数据来源 <a href="https://supercharge.info/service/supercharge/allSites" target="_blank">supercharge.info</a>。
    </div>`;

    app.innerHTML = html;
}

renderMain();
</script>
</body>
</html>
