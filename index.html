            { name: '伊利诺伊 IL', sites: 94, open: 66, rate: 70.2 },
            { name: '马里兰 MD', sites: 88, open: 64, rate: 72.7 },
            { name: '俄勒冈 OR', sites: 86, open: 53, rate: 61.6 },
            { name: '亚利桑那 AZ', sites: 85, open: 53, rate: 62.4 },
            { name: '科罗拉多 CO', sites: 82, open: 65, rate: 79.3 }
        ]
    }
};

// ============================================================
//  渲染引擎
// ============================================================
const D = REPORT_DATA;
const app = document.getElementById('app');

function fmt(n) { return n.toLocaleString(); }
function barCls(pct) {
    if (pct >= 80) return 'high';
    if (pct >= 60) return 'mid';
    if (pct >= 40) return 'low';
    return 'very-low';
}
function findCountry(name) {
    for (const r of D.regions) {
        for (const c of r.countries) {
            if (c.name === name) return c;
        }
    }
    return null;
}

// ── 主页 ──────────────────────────────────────────────────
function renderMain() {
    let html = `
    <div class="header">
        <h1>⚡ 特斯拉超充站<br>第三方开放${D.reportType}</h1>
        <div class="subtitle">
            <span class="sub-wrapper" tabindex="0">
                ${D.reportDate} · 数据来源 ${D.dataSource}
                <span class="info-icon">i</span>
                <div class="sub-tooltip">
                    <div class="sub-tooltip-title">统计口径说明</div>
                    <ul>
                        <li>总站点 = Status(Open/Expanding/Construction/Permit/Plan)的所有站点</li>
                        <li>开放站点 = 上述站点中 otherEVs=True 的站点</li>
                        <li>开放率 = 开放站点 / 总站点</li>
                        <li>数据不含香港、澳门</li>
                    </ul>
                </div>
            </span>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="label">总站点 / 充电枪数</div>
            <div class="value">${fmt(D.totalSites)}<span class="slash">/</span>${fmt(D.totalStalls)}</div>
        </div>
        <div class="stat-card">
            <div class="label">开放站点 / 充电枪数</div>
            <div class="value orange">${fmt(D.openSites)}<span class="slash">/</span>${fmt(D.openStalls)}</div>
        </div>
        <div class="stat-card">
            <div class="label">全球开放率</div>
            <div class="value green">${D.openRate.toFixed(1)}<span class="unit">%</span></div>
        </div>
        <div class="stat-card">
            <div class="label">覆盖国家/地区</div>
            <div class="value blue">${D.totalCountries}</div>
        </div>
    </div>`;

    // 本月变化（折叠）
    if (D.changes && D.changes.length > 0) {
        html += `<div class="changes-section"><details><summary>
            <span class="icon">📊</span><h2>本月变化</h2>
            <span class="toggle-hint">▾</span>
        </summary><div class="changes-body">`;
        D.changes.forEach(c => {
            html += `<div class="change-group"><div class="change-group-title">${c.type}</div>`;
            c.items.forEach(item => { html += `<div class="change-item"><span class="flag">${c.flag}</span>${item}</div>`; });
            html += `</div>`;
        });
        html += `</div></details></div>`;
    }

    // 大区表格
    D.regions.forEach(region => {
        const countryList = region.countries.map(c => c.name).join('、');
        html += `
    <div class="region-section">
        <div class="region-header">
            <span class="icon">${region.icon}</span>
            <h2>${region.name}</h2>
            <span class="count">${region.countries.length} 个国家/地区</span>
        </div>
        <div class="region-countries"><span>包含：</span>${countryList}</div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>国家/地区</th>
                    <th style="text-align:right">开放站点</th>
                    <th style="text-align:right">总站点</th>
                    <th style="text-align:right">开放充电枪</th>
                    <th style="text-align:right">总充电枪</th>
                    <th class="pct-cell">开放率</th>
                </tr>
            </thead>
            <tbody>`;
        region.countries.forEach(c => {
            const pct = c.total > 0 ? (c.open / c.total * 100) : 0;
            const cls = barCls(pct);
            const isFull = pct === 100;
            const hasDetail = !!COUNTRY_DETAIL[c.name];
            const rowAttrs = isFull ? ` class="full-row"` : (!hasDetail ? ' class="no-detail"' : '');
            const nameCls = hasDetail ? ' has-detail' : '';
            const clickAttr = hasDetail ? ` onclick="renderDetail('${c.name}')"` : '';
            html += `<tr${rowAttrs}${clickAttr}>
                <td class="country${nameCls}">${c.name}</td>
                <td class="num">${fmt(c.open)}</td>
                <td class="num">${fmt(c.total)}</td>
                <td class="num">${fmt(c.openStalls)}</td>
                <td class="num">${fmt(c.totalStalls)}</td>
                <td class="pct-cell"><div class="pct-bar-wrap"><div class="pct-bar-bg"><div class="pct-bar ${cls}" style="width:${pct.toFixed(1)}%"></div></div><span class="pct-val ${cls}">${pct.toFixed(1)}%</span></div></td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
    });

    html += `
    <div class="footer">
        共 ${D.totalCountries} 个国家/地区有超充站开放给第三方（otherEVs=true）。<br>
        数据来源 <a href="https://supercharge.info/service/supercharge/allSites" target="_blank">supercharge.info</a>。
    </div>`;

    app.innerHTML = html;
}

// ── 国家详情页 ─────────────────────────────────────────────
function renderDetail(name) {
    const cd = COUNTRY_DETAIL[name];
    const cd0 = findCountry(name);
    if (!cd || !cd0) return;

    const totalSites = cd0.total, openSites = cd0.open;
    const totalStalls = cd0.totalStalls, openStalls = cd0.openStalls;
    const openRate = totalSites > 0 ? (openSites / totalSites * 100) : 0;
    const maxStatus = Math.max(...cd.status.map(s => s.sites));
    const maxPower = Math.max(...cd.power.map(p => p.stalls));
    const maxPlug = Math.max(...cd.plugs.map(p => p.stalls));
    const maxState = Math.max(...cd.states.map(s => s.sites));
    const flagMap = { '美国': '🇺🇸', '中国': '🇨🇳', '德国': '🇩🇪', '英国': '🇬🇧', '法国': '🇫🇷', '日本': '🇯🇵', '韩国': '🇰🇷', '澳大利亚': '🇦🇺', '加拿大': '🇨🇦' };

    let html = `<div class="page-detail">`;

    html += `<button class="back-btn" onclick="renderMain()">‹ 返回概览</button>`;

    html += `
    <div class="detail-header">
        <h1>${flagMap[name] || '🌐'} ${name}</h1>
        <div class="sub">超充站详情 · ${D.reportDate}</div>
    </div>

    <div class="detail-stats">
        <div class="d-stat">
            <div class="label">总站点 / 充电枪</div>
            <div class="value">${fmt(totalSites)}<span class="slash">/</span>${fmt(totalStalls)}</div>
        </div>
        <div class="d-stat">
            <div class="label">开放站点 / 充电枪</div>
            <div class="value orange">${fmt(openSites)}<span class="slash">/</span>${fmt(openStalls)}</div>
        </div>
        <div class="d-stat">
            <div class="label">全球开放率对比</div>
            <div class="value green">${openRate.toFixed(1)}%</div>
        </div>
    </div>

    <div class="detail-sec">
        <div class="detail-sec-header"><span class="icon">📍</span><h3>Status 分布</h3></div>
        <div class="detail-sec-body">`;
    cd.status.forEach(s => {
        const pct = (s.sites / maxStatus * 100).toFixed(1);
        const share = (s.sites / totalSites * 100).toFixed(1);
        html += `<div class="mbar-row">
            <div class="mbar-label">${s.label}</div>
            <div class="mbar-bg"><div class="mbar blue" style="width:${pct}%"></div></div>
            <div class="mbar-val">${fmt(s.sites)}站</div>
            <div class="mbar-sub">${share}%</div>
        </div>`;
    });
    html += `</div></div>

    <div class="detail-sec">
        <div class="detail-sec-header"><span class="icon">⚡</span><h3>功率等级分布</h3></div>
        <div class="detail-sec-body">`;
    cd.power.forEach(p => {
        const pct = (p.stalls / maxPower * 100).toFixed(1);
        html += `<div class="mbar-row">
            <div class="mbar-label">${p.label}</div>
            <div class="mbar-bg"><div class="mbar orange" style="width:${pct}%"></div></div>
            <div class="mbar-val">${fmt(p.stalls)}枪</div>
            <div class="mbar-sub">${fmt(p.sites)}站</div>
        </div>`;
    });
    html += `</div></div>

    <div class="detail-sec">
        <div class="detail-sec-header"><span class="icon">🔌</span><h3>插头标准分布</h3></div>
        <div class="detail-sec-body">`;
    cd.plugs.forEach(p => {
        const pct = (p.stalls / maxPlug * 100).toFixed(1);
        html += `<div class="mbar-row">
            <div class="mbar-label">${p.label}</div>
            <div class="mbar-bg"><div class="mbar green" style="width:${pct}%"></div></div>
            <div class="mbar-val">${fmt(p.stalls)}枪</div>
        </div>`;
    });
    html += `</div></div>

    <div class="detail-sec">
        <div class="detail-sec-header"><span class="icon">🌱</span><h3>绿色能源 & 站点年龄</h3></div>
        <div class="detail-sec-body">
            <div class="tag-row">
                <div class="tag"><span class="tag-label">☀️ 光伏顶</span><span class="tag-val">${cd.solar}站 · ${fmt(cd.solarStalls)}枪</span></div>
                <div class="tag"><span class="tag-label">🔋 储能</span><span class="tag-val">${cd.battery}站 · ${fmt(cd.batteryStalls)}枪</span></div>
                <div class="tag green-tag"><span class="tag-label">📅 平均站龄</span><span class="tag-val">${cd.avgAge}</span></div>
                <div class="tag"><span class="tag-label">🆕 最新开业</span><span class="tag-val">${cd.newestOpen}</span></div>
                <div class="tag"><span class="tag-label">📆 最早开业</span><span class="tag-val">${cd.oldestOpen}</span></div>
            </div>
        </div>
    </div>

    <div class="detail-sec">
        <div class="detail-sec-header"><span class="icon">🗺️</span><h3>Top 15 州分布</h3></div>
        <div class="detail-sec-body" style="padding:12px 0 8px">
            <table class="state-table">
                <thead>
                    <tr><th>州</th><th style="text-align:right">站点</th><th style="text-align:right">开放</th><th style="text-align:right">开放率</th><th>占比</th></tr>
                </thead>
                <tbody>`;
    cd.states.forEach(s => {
        const pct = (s.sites / maxState * 100).toFixed(1);
        const rcls = s.rate >= 80 ? 'high' : s.rate >= 60 ? 'mid' : s.rate >= 40 ? 'low' : 'very-low';
        html += `<tr>
            <td class="state-name">${s.name}</td>
            <td class="num">${fmt(s.sites)}</td>
            <td class="num">${fmt(s.open)}</td>
            <td class="num"><span class="pct-val ${rcls}">${s.rate.toFixed(1)}%</span></td>
            <td><div class="pct-bar-bg" style="width:100px"><div class="pct-bar blue" style="width:${pct}%"></div></div></td>
        </tr>`;
    });
    html += `</tbody></table></div></div>`;

    html += `</div>`;
    app.innerHTML = html;
}

window.renderMain = renderMain;
window.renderDetail = renderDetail;
renderMain();
</script>
</body>
</html>
