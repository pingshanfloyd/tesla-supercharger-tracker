<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特斯拉超充站第三方开放追踪</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(232, 65, 24, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 8px; position: relative; text-align: center; line-height: 1.4; }
        .header .subtitle { color: #8a8ab0; font-size: 14px; position: relative; text-align: center; }

        /* Stats Row */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: #141420; border: 1px solid #1e1e30; border-radius: 12px; padding: 20px; text-align: center;
        }
        .stat-card .label { color: #6a6a8a; font-size: 13px; margin-bottom: 6px; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: #fff; }
        .stat-card .value.orange { color: #e84118; }
        .stat-card .value.green { color: #00d2d3; }
        .stat-card .value.blue { color: #54a0ff; }
        .stat-card .unit { font-size: 14px; color: #6a6a8a; margin-left: 2px; }
        .stat-card .value .slash { color: #4a4a6a; margin: 0 2px; }

        /* Changes Section */
        .changes-section {
            background: #141420; border: 1px solid #1e1e30; border-radius: 12px;
            margin-bottom: 24px; overflow: hidden;
        }
        .changes-header { padding: 16px 24px; border-bottom: 1px solid #1e1e30; display: flex; align-items: center; gap: 10px; }
        .changes-header .icon { font-size: 22px; }
        .changes-header h2 { font-size: 18px; font-weight: 600; color: #fff; }
        .changes-body { padding: 20px 24px; }
        .change-group { margin-bottom: 16px; }
        .change-group:last-child { margin-bottom: 0; }
        .change-group-title { font-size: 14px; font-weight: 600; color: #8a8ab0; margin-bottom: 8px; }
        .change-item { font-size: 14px; color: #c0c0d0; padding: 4px 0; }
        .change-item .flag { margin-right: 6px; }

        /* Region Section */
        .region-section {
            background: #141420; border: 1px solid #1e1e30; border-radius: 12px;
            margin-bottom: 20px; overflow: hidden;
        }
        .region-header {
            padding: 16px 24px; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid #1e1e30; flex-wrap: wrap;
        }
        .region-header .icon { font-size: 22px; }
        .region-header h2 { font-size: 18px; font-weight: 600; color: #fff; }
        .region-header .count {
            margin-left: auto; background: #1e1e30; color: #8a8ab0;
            padding: 2px 10px; border-radius: 20px; font-size: 13px;
        }
        .region-countries {
            padding: 10px 24px; color: #6a6a8a; font-size: 13px;
            border-bottom: 1px solid #12121e; line-height: 1.8;
        }
        .region-countries span { color: #8a8ab0; margin-right: 4px; }

        /* Table */
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th {
            text-align: left; padding: 12px 20px; color: #6a6a8a; font-size: 12px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid #1e1e30;
        }
        .data-table th:first-child { min-width: 5.5em; }
        .data-table td { padding: 10px 20px; font-size: 14px; border-bottom: 1px solid #12121e; }
        .data-table tr:hover { background: #1a1a28; }
        .data-table .country { font-weight: 500; color: #fff; white-space: nowrap; }
        .data-table .num { font-variant-numeric: tabular-nums; color: #c0c0d0; text-align: right; }
        .data-table .pct-cell { width: 180px; }
        .pct-bar-wrap { display: flex; align-items: center; gap: 10px; }
        .pct-bar-bg { flex: 1; height: 8px; background: #1e1e30; border-radius: 4px; overflow: hidden; }
        .pct-bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
        .pct-bar.high { background: linear-gradient(90deg, #00d2d3, #01a3a4); }
        .pct-bar.mid { background: linear-gradient(90deg, #54a0ff, #2e86de); }
        .pct-bar.low { background: linear-gradient(90deg, #feca57, #ff9f43); }
        .pct-bar.very-low { background: linear-gradient(90deg, #ff6b6b, #ee5a24); }
        .pct-val { min-width: 48px; text-align: right; font-size: 13px; font-weight: 600; }
        .pct-val.high { color: #00d2d3; }
        .pct-val.mid { color: #54a0ff; }
        .pct-val.low { color: #feca57; }
        .pct-val.very-low { color: #ff6b6b; }

        /* Full rate row (100%) */
        .full-row td { background: #0d1a0d; }
        .full-row .country { color: #00d2d3; }

        /* Footer */
        .footer {
            text-align: center; padding: 30px 20px; color: #4a4a6a; font-size: 13px; line-height: 1.8;
        }
        .footer a { color: #54a0ff; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 22px; }
            .stat-card .value { font-size: 22px; }
            .data-table th, .data-table td { padding: 10px 10px; font-size: 13px; }
            .data-table th:first-child { min-width: 5em; }
            .pct-cell { width: 140px; }
        }
        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr 1fr; }
            .header { padding: 24px 20px; }
            .data-table th, .data-table td { padding: 8px 6px; font-size: 12px; }
            .data-table th:first-child { min-width: 4.5em; }
            .pct-cell { width: 100px; }
            .pct-bar-wrap { gap: 4px; }
            .pct-val { min-width: 36px; font-size: 11px; }
        }
    </style>
</head>

// ============================================================
//  模板代码 —— 请勿修改

(function() {
    const D = REPORT_DATA;
    const app = document.getElementById('app');

    // Helper: get bar color class
    function barClass(pct) {
        if (pct >= 80) return 'high';
        if (pct >= 60) return 'mid';
        if (pct >= 40) return 'low';
        return 'very-low';
    }

    // Helper: format number with commas
    function fmt(n) { return n.toLocaleString(); }

    // Build header
    let html = `
    <div class="header">
        <h1>⚡ 特斯拉超充站<br>第三方开放${D.reportType}</h1>
        <div class="subtitle">${D.reportDate} · 数据来源 ${D.dataSource}</div>
    </div>`;

    // Build stats - 4 cards with combined metrics
    html += `
    <div class="stats-row">
        <div class="stat-card">
            <div class="label">总站点 / 充电枪数</div>
            <div class="value">${fmt(D.totalSites)}<span class="slash">/</span>${fmt(D.totalStalls)}</div>
        </div>
        <div class="stat-card">
            <div class="label">开放站点 / 充电枪数</div>
            <div class="value orange">${fmt(D.openSites)}<span class="slash">/</span>${fmt(D.openStalls)}</div>
        </div>
        <div class="stat-card">
            <div class="label">全球开放率</div>
            <div class="value green">${D.openRate.toFixed(1)}<span class="unit">%</span></div>
        </div>
        <div class="stat-card">
            <div class="label">覆盖国家/地区</div>
            <div class="value blue">${D.totalCountries}</div>
        </div>
    </div>`;

    // Build changes section (if any)
    if (D.changes && D.changes.length > 0) {
        html += `<div class="changes-section">
            <div class="changes-header">
                <span class="icon">📊</span>
                <h2>本月变化</h2>
            </div>
            <div class="changes-body">`;
        D.changes.forEach(c => {
            html += `<div class="change-group">
                <div class="change-group-title">${c.type}</div>`;
            c.items.forEach(item => {
                html += `<div class="change-item"><span class="flag">${c.flag}</span>${item}</div>`;
            });
            html += `</div>`;
        });
        html += `</div></div>`;
    }

    // Build regions
    D.regions.forEach(region => {
        if (!region.countries || region.countries.length === 0) return;

        const countryList = region.countries.map(c => c.name).join('、');

        html += `
    <div class="region-section">
        <div class="region-header">
            <span class="icon">${region.icon}</span>
            <h2>${region.name}</h2>
            <span class="count">${region.countries.length} 个国家/地区</span>
        </div>
        <div class="region-countries"><span>包含：</span>${countryList}</div>
        <table class="data-table">
            <thead>
                <tr><th>国家/地区</th><th style="text-align:right">开放站点</th><th style="text-align:right">总站点</th><th style="text-align:right">开放充电枪</th><th style="text-align:right">总充电枪</th><th class="pct-cell">开放率</th></tr>
            </thead>
            <tbody>`;

        region.countries.forEach(c => {
            const pct = c.total > 0 ? (c.open / c.total * 100) : 0;
            const cls = barClass(pct);
            const isFull = (pct === 100);
            const rowCls = isFull ? ' class="full-row"' : '';
            html += `
                <tr${rowCls}>
                    <td class="country">${c.name}</td>
                    <td class="num">${fmt(c.open)}</td>
                    <td class="num">${fmt(c.total)}</td>
                    <td class="num">${fmt(c.openStalls)}</td>
                    <td class="num">${fmt(c.totalStalls)}</td>
                    <td class="pct-cell"><div class="pct-bar-wrap"><div class="pct-bar-bg"><div class="pct-bar ${cls}" style="width:${pct.toFixed(1)}%"></div></div><span class="pct-val ${cls}">${pct.toFixed(1)}%</span></div></td>
                </tr>`;
        });

        html += `</tbody></table></div>`;
    });

    // Build footer
    const footerNote = `共 ${D.totalCountries} 个国家/地区有超充站开放给第三方（otherEVs=true）。`;

    html += `
    <div class="footer">
        ${footerNote}<br>
        数据来源 <a href="https://supercharge.info/service/supercharge/allSites" target="_blank">supercharge.info</a>，otherEVs=true 表示该站点允许非特斯拉车辆使用。香港、台湾等在报告中列为地区。
    </div>`;

    app.innerHTML = html;
})();
