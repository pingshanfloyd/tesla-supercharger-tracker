const regionSortState = {};
function handleSort(ridx, col) {
    const s = regionSortState[ridx] || {col:null,asc:true};
    if (s.col===col) s.asc=!s.asc; else { s.col=col; s.asc=false; }
    regionSortState[ridx]=s;
    renderMain();
}

let currentSearchValue = '';
function handleSearch(value) {
    currentSearchValue = value;
    const kw = value.trim().toLowerCase();
    const sections = document.querySelectorAll('.region-section');
    let total = 0;
    sections.forEach(sec => {
        const rows = sec.querySelectorAll('tr.country-row');
        let vis = 0;
        rows.forEach(row => {
            const cn = row.getAttribute('data-country');
            const det = sec.querySelector(`tr[data-country-detail="${cn}"]`);
            if (!kw || cn.toLowerCase().includes(kw)) {
                row.style.display = '';
                if (det) det.style.display = row.classList.contains('expanded') ? 'table-row' : 'none';
                vis++;
            } else {
                row.style.display = 'none';
                if (det) det.style.display = 'none';
            }
        });
        sec.style.display = (vis===0 && kw) ? 'none' : '';
        total += vis;
    });
    const em = document.getElementById('searchEmpty');
    if (em) em.style.display = (kw && total===0) ? 'block' : 'none';
}

    const secs = document.querySelectorAll('.region-section');
    const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if(e.isIntersecting) { const idx=e.target.id.replace('region-',''); btns.forEach(b=>b.classList.toggle('active',b.getAttribute('data-region')===idx)); } });
    }, {threshold:0.3, rootMargin:'-20px 0px -60% 0px'});
    secs.forEach(s => obs.observe(s));
}

const expandedRows = new Set();
function toggleRowExpand(rowEl, cn) {
    event.stopPropagation();
    const det = document.querySelector(`tr[data-country-detail="${cn}"]`);
    if (!det) return;
    if (expandedRows.has(cn)) { expandedRows.delete(cn); rowEl.classList.remove('expanded'); det.classList.remove('expanded'); det.style.display='none'; }
    else { expandedRows.add(cn); rowEl.classList.add('expanded'); det.classList.add('expanded'); det.style.display='table-row'; }
}

renderMain();
</script>
</body>
</html>
