        .header::before {

            border-radius: 50%; font-size: 10px; color: #8a8ab0; line-height: 1;
        }
        .sub-tooltip {

            padding: 14px 18px; font-size: 13px; color: #c0c0d0; line-height: 1.8;

            const cls = barCls(pct);
            const isFull = pct === 100;
            const rowAttrs = isFull ? ` class="full-row"` : ` class="no-detail"`;
            html += `<tr${rowAttrs}>
                <td class="country">${c.name}</td>
                <td class="num">${fmt(c.open)}</td>
                <td class="num">${fmt(c.total)}</td>
                <td class="num">${fmt(c.openStalls)}</td>
                <td class="num">${fmt(c.totalStalls)}</td>
                <td class="pct-cell"><div class="pct-bar-wrap"><div class="pct-bar-bg"><div class="pct-bar ${cls}" style="width:${pct.toFixed(1)}%"></div></div><span class="pct-val ${cls}">${pct.toFixed(1)}%</span></div></td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
    });

    html += `
    <div class="footer">
        共 ${D.totalCountries} 个国家/地区有超充站开放给第三方（otherEVs=true）。<br>
        数据来源 <a href="https://supercharge.info/service/supercharge/allSites" target="_blank">supercharge.info</a>。
    </div>`;

    app.innerHTML = html;
}

renderMain();
</script>
</body>
</html>
