const COUNTRY_DETAIL = {};
const D = REPORT_DATA;
const app = document.getElementById('app');
function fmt(n) { return n.toLocaleString(); }
function barCls(pct) {
    if (pct >= 80) return 'high';
    if (pct >= 60) return 'mid';
    if (pct >= 40) return 'low';
    return 'very-low';
}

function renderMain() {
    let html = `
    <div class="header-tech">
        <button class="theme-toggle" id="themeToggle" title="切换亮色/暗色模式">${document.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️'}</button>
        <div style="text-align:center"><span class="tech-tag"><span class="pulse"></span>LIVE DATA · ${D.reportDate}</span></div>
        <h1>⚡ 特斯拉超充<span class="gradient-text">开放</span>追踪</h1>
        <p class="tech-subtitle">全球哪些超充站对其他电动车品牌开放？</p>
        <div class="tech-meta">
            <span class="tech-meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                ${D.totalCountries} 个国家/地区
            </span>
            <span class="tech-meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                ${D.reportDate}
            </span>
            <span class="tech-meta-item sub-wrapper" tabindex="0">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                数据来源 ${D.dataSource}
                <span class="info-icon">i</span>
                <div class="sub-tooltip">
                    <div class="sub-tooltip-title">统计口径说明</div>
                    <ul>
                        <li>总站点 = Status(Open/Expanding/Construction/Permit/Plan)的所有站点</li>
                        <li>开放站点 = 上述站点中 otherEVs=True 的站点</li>
                        <li>开放率 = 开放站点 / 总站点</li>
                        <li>香港、台湾等在报告中列为地区</li>
                    </ul>
                </div>
            </span>
        </div>
    </div>
    <div class="stats-row">
        <div class="stat-card"><div class="label">总站点 / 充电枪数</div><div class="value">${fmt(D.totalSites)}<span class="slash">/</span>${fmt(D.totalStalls)}</div></div>
        <div class="stat-card"><div class="label">开放站点 / 充电枪数</div><div class="value orange">${fmt(D.openSites)}<span class="slash">/</span>${fmt(D.openStalls)}</div></div>
        <div class="stat-card"><div class="label">全球开放率</div><div class="value green">${D.openRate.toFixed(1)}<span class="unit">%</span></div></div>
        <div class="stat-card"><div class="label">覆盖国家/地区</div><div class="value blue">${D.totalCountries}</div></div>
    </div>`;
    if (D.changes && D.changes.length > 0) {
        html += `<div class="changes-section"><details><summary>
            <span class="icon">📊</span><h2>本月变化</h2><span class="toggle-hint">▾</span>
        </summary><div class="changes-body">`;
        D.changes.forEach(c => {
            html += `<div class="change-group"><div class="change-group-title">${c.type}</div>`;
            c.items.forEach(item => { html += `<div class="change-item"><span class="flag">${c.flag}</span>${item}</div>`; });
            html += `</div>`;
        });
        html += `</div></details></div>`;
    }
    html += `<div class="search-bar"><div class="search-wrapper"><span class="search-icon">🔍</span><input type="text" class="search-input" id="countrySearch" placeholder="搜索国家/地区..." oninput="handleSearch(this.value)"></div></div>`;
    html += `<div class="search-empty" id="searchEmpty">未找到匹配的国家/地区</div>`;
    html += `<div class="anchor-nav">`;
    D.regions.forEach((region, idx) => { html += `<button class="anchor-btn" data-region="${idx}" onclick="scrollToRegion(${idx})">${region.icon} ${region.name}</button>`; });
    html += `</div>`;
    D.regions.forEach((region, ridx) => {
        const countryList = region.countries.map(c => c.name).join('、');

        html += `<table class="data-table" data-region="${ridx}"><thead><tr>`;
        html += `<th>国家/地区</th>`;
        html += `<th class="sortable" style="text-align:right" onclick="handleSort(${ridx},'open')${ss.col==='open'?' sort-active':''}">开放站点${ss.col==='open'?`<span class="sort-arrow">${ss.asc?'↑':'↓'}</span>`:''}</th>`;
        html += `<th class="sortable" style="text-align:right" onclick="handleSort(${ridx},'total')${ss.col==='total'?' sort-active':''}">总站点${ss.col==='total'?`<span class="sort-arrow">${ss.asc?'↑':'↓'}</span>`:''}</th>`;
        html += `<th class="sortable" style="text-align:right" onclick="handleSort(${ridx},'openStalls')${ss.col==='openStalls'?' sort-active':''}">开放充电枪${ss.col==='openStalls'?`<span class="sort-arrow">${ss.asc?'↑':'↓'}</span>`:''}</th>`;
        html += `<th class="sortable" style="text-align:right" onclick="handleSort(${ridx},'totalStalls')${ss.col==='totalStalls'?' sort-active':''}">总充电枪${ss.col==='totalStalls'?`<span class="sort-arrow">${ss.asc?'↑':'↓'}</span>`:''}</th>`;
        html += `<th class="sortable pct-cell" onclick="handleSort(${ridx},'rate')${ss.col==='rate'?' sort-active':''}">开放率${ss.col==='rate'?`<span class="sort-arrow">${ss.asc?'↑':'↓'}</span>`:''}</th>`;
        html += `</tr></thead><tbody>`;
        let countries = [...region.countries];
        if (ss.col) {
            countries.sort((a,b) => {
                let va,vb;
                if (ss.col==='rate') { va=a.total>0?a.open/a.total:0; vb=b.total>0?b.open/b.total:0; }
                else { va=a[ss.col]; vb=b[ss.col]; }
                return ss.asc ? va-vb : vb-va;
            });
        }
        countries.forEach(c => {
            const pct = c.total>0?(c.open/c.total*100):0;
            const cls = barCls(pct); const isFull = pct===100;
            const isExpanded = expandedRows.has(c.name);
            const rowClass = isFull ? 'full-row country-row' : 'country-row';
            const expandCls = isExpanded ? ' expanded' : '';
            html += `<tr class="${rowClass}${expandCls}" data-country="${c.name}" onclick="toggleRowExpand(this,'${c.name}')">`;
            html += `<td class="country"><span class="expand-arrow">▶</span>${c.name}</td>`;
            html += `<td class="num">${fmt(c.open)}</td><td class="num">${fmt(c.total)}</td>`;
            html += `<td class="num">${fmt(c.openStalls)}</td><td class="num">${fmt(c.totalStalls)}</td>`;
            html += `<td class="pct-cell"><div class="pct-bar-wrap"><div class="pct-bar-bg"><div class="pct-bar ${cls}" style="width:${pct.toFixed(1)}%"></div></div><span class="pct-val ${cls}">${pct.toFixed(1)}%</span></div></td></tr>`;
            html += `<tr class="detail-expand-row${isExpanded?' expanded':''}" data-country-detail="${c.name}"><td colspan="6"><div class="detail-expand-content"><h4>${c.name}${c.isRegion?'（地区）':''}</h4>`;
            html += `<div class="detail-field"><span class="detail-label">开放站点：</span>${fmt(c.open)} / ${fmt(c.total)}</div>`;
            html += `<div class="detail-field"><span class="detail-label">开放充电枪：</span>${fmt(c.openStalls)} / ${fmt(c.totalStalls)}</div>`;
            html += `<div class="detail-field"><span class="detail-label">开放率：</span>${pct.toFixed(1)}%</div></div></td></tr>`;
        });
        html += `</tbody></table></div>`;
    });
    if (D.archive && D.archive.length > 0) {
        html += `<div class="archive-section"><h3>📅 历史数据</h3><ul class="archive-list">`;
        D.archive.forEach(a => {
            html += `<li><a href="${a.url}">${a.label}</a><span class="arch-stats">${a.stats}</span></li>`;
        });
        html += `</ul></div>`;
    }
    html += `<div class="footer">共 ${D.totalCountries} 个国家/地区有超充站开放给第三方（otherEVs=true）。<br>数据来源 <a href="https://supercharge.info/service/supercharge/allSites" target="_blank">supercharge.info</a>。<br><a href="https://tesla.gann.ing" style="color:#4a4a6a">tesla.gann.ing</a></div>`;
    app.innerHTML = html;
    const sv = currentSearchValue;
    if (sv) { document.getElementById('countrySearch').value = sv; handleSearch(sv); }
    setupScrollSpy();
}

const regionSortState = {};
function handleSort(ridx, col) {
    const s = regionSortState[ridx] || {col:null,asc:true};
    if (s.col===col) s.asc=!s.asc; else { s.col=col; s.asc=false; }
    regionSortState[ridx]=s;
    renderMain();
}

// ── Theme Toggle ──
(function() {
    const saved = localStorage.getItem('tesla-tracker-theme');
    if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
    }
})();
document.addEventListener('click', function(e) {
    if (e.target.closest('#themeToggle')) {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        if (next === 'dark') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('tesla-tracker-theme', next);
        e.target.textContent = next === 'light' ? '🌙' : '☀️';
    }
});

let currentSearchValue = '';
function handleSearch(value) {
    currentSearchValue = value;
    const kw = value.trim().toLowerCase();
    const sections = document.querySelectorAll('.region-section');
    let total = 0;
    sections.forEach(sec => {
        const rows = sec.querySelectorAll('tr.country-row');
        let vis = 0;
        rows.forEach(row => {
            const cn = row.getAttribute('data-country');
            const det = sec.querySelector(`tr[data-country-detail="${cn}"]`);
            if (!kw || cn.toLowerCase().includes(kw)) {
                row.style.display = '';
                if (det) det.style.display = row.classList.contains('expanded') ? 'table-row' : 'none';
                vis++;
            } else {
                row.style.display = 'none';
                if (det) det.style.display = 'none';
            }
        });
        sec.style.display = (vis===0 && kw) ? 'none' : '';
        total += vis;
    });
    const em = document.getElementById('searchEmpty');
    if (em) em.style.display = (kw && total===0) ? 'block' : 'none';
}

function scrollToRegion(idx) { const el=document.getElementById('region-'+idx); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
function setupScrollSpy() {
    const btns = document.querySelectorAll('.anchor-btn');
    const secs = document.querySelectorAll('.region-section');
    const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if(e.isIntersecting) { const idx=e.target.id.replace('region-',''); btns.forEach(b=>b.classList.toggle('active',b.getAttribute('data-region')===idx)); } });
    }, {threshold:0.3, rootMargin:'-20px 0px -60% 0px'});
    secs.forEach(s => obs.observe(s));
}

const expandedRows = new Set();
function toggleRowExpand(rowEl, cn) {
    event.stopPropagation();
    const det = document.querySelector(`tr[data-country-detail="${cn}"]`);
    if (!det) return;
    if (expandedRows.has(cn)) { expandedRows.delete(cn); rowEl.classList.remove('expanded'); det.classList.remove('expanded'); det.style.display='none'; }
    else { expandedRows.add(cn); rowEl.classList.add('expanded'); det.classList.add('expanded'); det.style.display='table-row'; }
}

renderMain();
